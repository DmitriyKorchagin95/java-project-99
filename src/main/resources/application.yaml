spring:
  application:
    name: app
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

rsa:
  public-key: classpath:certs/public.pem
  private-key: classpath:certs/private.pem

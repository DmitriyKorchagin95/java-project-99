spring:
  application:
    name: app
  jpa:
    generate-ddl: true
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
  output:
    ansi:
      enabled: always
  profiles:
    default: development

  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      api-docs:
        path: /api-docs

logging:
  level:
    root: WARN
    org:
      springframework:
        security: DEBUG

rsa:
  public-key: classpath:certs/public.pem
  private-key: classpath:certs/private.pem
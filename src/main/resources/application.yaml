spring:
  application:
    name: app
  jpa:
    generate-ddl: true
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
  output:
    ansi:
      enabled: always
  profiles:
    default: production

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /api-docs/swagger-config
    url: /api-docs


logging:
  level:
    root: WARN
    org:
      springframework:
        security: DEBUG

rsa:
  public-key: classpath:certs/public.pem
  private-key: classpath:certs/private.pem